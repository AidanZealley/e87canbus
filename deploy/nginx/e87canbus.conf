user www-data;
pid /run/e87canbus-nginx/nginx.pid;
error_log stderr;

events {}

http {
    access_log off;
    client_body_temp_path /run/e87canbus-nginx/client-body;
    proxy_temp_path /run/e87canbus-nginx/proxy;
    fastcgi_temp_path /run/e87canbus-nginx/fastcgi;
    uwsgi_temp_path /run/e87canbus-nginx/uwsgi;
    scgi_temp_path /run/e87canbus-nginx/scgi;
    server {
        listen 10.42.0.1:443 ssl;
        ssl_certificate /etc/e87canbus/server-certificate.pem;
        ssl_certificate_key /etc/e87canbus/server-private-key.pem;
        ssl_client_certificate /etc/e87canbus/installation-ca.pem;
        ssl_verify_client optional;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /api/live {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 30s;
            proxy_set_header Host 10.42.0.1;
            proxy_set_header X-Forwarded-Host 10.42.0.1;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-E87-Client-Verify $ssl_client_verify;
            proxy_set_header X-E87-Client-Certificate $ssl_client_escaped_cert;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host 10.42.0.1;
            proxy_set_header X-Forwarded-Host 10.42.0.1;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-E87-Client-Verify $ssl_client_verify;
            proxy_set_header X-E87-Client-Certificate $ssl_client_escaped_cert;
        }
    }
}
