name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm api:check
        working-directory: frontend
      - run: uv run pytest -q
      - run: uv run mypy
      - run: uv run ruff check e87ctl hosts scripts/watch_frontend_contracts.py
      - run: |
          for script in e87ctl/scripts/build-pi-image \
            e87ctl/application-builder/build-application \
            deploy/bin/e87canbus-firewall deploy/kiosk/*.sh \
            images/*/customize.sh images/e87canbus-image-check scripts/*.sh; do
            bash -n "$script"
          done
      - run: |
          python3 -m py_compile \
            deploy/bin/e87canbus-provision \
            e87ctl/application-builder/make-entry-points-relocatable
      - run: uv run lint-imports
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
