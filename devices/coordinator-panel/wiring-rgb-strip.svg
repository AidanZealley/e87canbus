<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Coordinator panel RGB strip wiring</title>
  <desc id="desc">The NeoPixel Driver BFF positive, signal and ground outputs connect to the five-pixel strip positive five volts, data input and ground.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526078; }
      .device { fill: #f5f7fb; stroke: #29354d; stroke-width: 3; }
      .device-title { font-size: 22px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #526078; }
      .terminal { fill: #fff; stroke-width: 4; }
      .wire { fill: none; stroke-width: 8; stroke-linecap: round; }
      .note { fill: #fff8df; stroke: #c59018; stroke-width: 2; }
    </style>
    <marker id="data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2878d0"/>
    </marker>
  </defs>

  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="60" y="58" class="title">Coordinator panel → RGB strip</text>
  <text x="60" y="87" class="subtitle">For exactly five WS2812B- or SK6812-compatible 5 V pixels.</text>

  <rect x="70" y="145" width="355" height="370" rx="22" class="device"/>
  <text x="105" y="188" class="device-title">QT Py RP2040</text>
  <text x="105" y="216" class="device-title">+ NeoPixel Driver BFF</text>
  <text x="105" y="251" class="small">BFF default A3 jumper stays intact</text>
  <rect x="218" y="290" width="170" height="170" rx="14" fill="#e8ecf4" stroke="#56637a" stroke-width="2"/>
  <text x="245" y="320" class="label">3-pin output</text>
  <circle cx="388" cy="350" r="11" class="terminal" stroke="#d6293e"/>
  <circle cx="388" cy="390" r="11" class="terminal" stroke="#2878d0"/>
  <circle cx="388" cy="430" r="11" class="terminal" stroke="#20242c"/>
  <text x="244" y="356" class="label">+ / 5V</text>
  <text x="244" y="396" class="label">Sig (A3)</text>
  <text x="244" y="436" class="label">− / GND</text>

  <rect x="765" y="145" width="365" height="370" rx="22" class="device"/>
  <text x="800" y="188" class="device-title">Five-pixel RGB strip</text>
  <text x="800" y="216" class="small">Connect at the INPUT end</text>
  <circle cx="765" cy="350" r="11" class="terminal" stroke="#d6293e"/>
  <circle cx="765" cy="390" r="11" class="terminal" stroke="#2878d0"/>
  <circle cx="765" cy="430" r="11" class="terminal" stroke="#20242c"/>
  <text x="800" y="356" class="label">+5V</text>
  <text x="800" y="396" class="label">DIN</text>
  <text x="800" y="436" class="label">GND</text>
  <rect x="838" y="270" width="280" height="76" rx="8" fill="#d9deea" stroke="#56637a" stroke-width="2"/>
  <g transform="translate(848 286)">
    <rect x="0" y="0" width="44" height="44" rx="6" fill="#f05a62" stroke="#29354d" stroke-width="2"/>
    <rect x="54" y="0" width="44" height="44" rx="6" fill="#f2bc4d" stroke="#29354d" stroke-width="2"/>
    <rect x="108" y="0" width="44" height="44" rx="6" fill="#57bc7c" stroke="#29354d" stroke-width="2"/>
    <rect x="162" y="0" width="44" height="44" rx="6" fill="#4ea2db" stroke="#29354d" stroke-width="2"/>
    <rect x="216" y="0" width="44" height="44" rx="6" fill="#936ed0" stroke="#29354d" stroke-width="2"/>
  </g>
  <text x="845" y="260" class="small">pixel 0</text>
  <text x="1060" y="260" class="small">pixel 4</text>

  <path d="M399 350 H754" class="wire" stroke="#d6293e"/>
  <path d="M399 390 H754" class="wire" stroke="#2878d0" marker-end="url(#data-arrow)"/>
  <path d="M399 430 H754" class="wire" stroke="#20242c"/>
  <text x="520" y="337" class="label" fill="#d6293e">5 V</text>
  <text x="500" y="380" class="label" fill="#2878d0">data direction</text>
  <text x="515" y="456" class="label">common ground</text>

  <rect x="70" y="552" width="1060" height="60" rx="12" class="note"/>
  <text x="94" y="579" class="label">Use DIN, not DOUT.</text>
  <text x="94" y="601" class="small">Strip +5 V comes from the fused Pi harness through the BFF. Match labels if your connector wire colours differ.</text>
</svg>
