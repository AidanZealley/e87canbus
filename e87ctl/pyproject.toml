[project]
name = "e87ctl"
version = "0.1.0"
description = "Workstation tooling for e87canbus device lifecycle operations."
requires-python = ">=3.11"

[project.scripts]
e87ctl = "e87ctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e87ctl"]
