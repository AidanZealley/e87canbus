# METABEGIN
# X-Env-Layer-Name: e87-coordinator
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Category: application
# X-Env-Layer-Desc: Stable Raspberry Pi 4 coordinator host configuration
# X-Env-Layer-Requires: e87-common
# METAEND
---
mmdebstrap:
  packages:
    - dnsmasq-base
    - nftables
    - nginx-light
  customize-hooks:
    - '"$SRCROOT/coordinator/customize.sh" "$1" "$SRCROOT/../deploy"'
    - $BDEBSTRAP_HOOKS/enable-units "$1" e87canbus-kcan.service e87canbus-ptcan.service e87canbus-fcan.service e87canbus-controller.service e87canbus-firewall.service e87canbus-dnsmasq.service e87canbus-nginx.service
